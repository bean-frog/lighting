<!doctype html>
<html lang="en" class="h-dvh overflow-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#010203">
  <meta name="description" content="BNFG Lighting. Small event lighting at UO.">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="gallery.css">
  <title>BNFG Lighting</title>
</head>
<body class="relative h-dvh overflow-hidden bg-[#010203] text-white antialiased">

  <div aria-hidden="true" class="pointer-events-none absolute inset-0">
    <div class="absolute -top-16 left-1/2 h-32 w-56 -translate-x-1/2 rounded-full bg-white/60 blur-3xl"></div>

    <div class="absolute inset-0 motion-safe:animate-pulse motion-safe:[animation-duration:7s]">
      <div class="absolute inset-0 bg-[conic-gradient(from_145deg_at_50%_-4%,transparent_0deg,rgb(255_255_255/0.05)_15deg,rgb(255_255_255/0.2)_35deg,rgb(255_255_255/0.05)_55deg,transparent_70deg)] mask-[linear-gradient(to_bottom,black_30%,transparent_95%)] blur-xl"></div>
    </div>
  </div>

  <main class="relative z-10 flex h-dvh flex-col items-center justify-center px-6 text-center font-[family-name:Helvetica_Neue,Helvetica,Arial,sans-serif]">
    <div class="relative">
      <div aria-hidden="true" class="pointer-events-none absolute top-1/2 left-1/2 h-[220%] w-[160%] -translate-x-1/2 -translate-y-1/2 bg-[radial-gradient(closest-side,rgb(255_255_255/0.14),transparent)]"></div>
      <h1 class="relative bg-linear-to-b from-white via-white to-white/55 bg-clip-text pb-[0.08em] text-[clamp(3rem,min(16vw,18vh),8rem)] leading-none font-black tracking-tighter text-transparent drop-shadow-[0_0_35px_rgb(255_255_255/0.35)]">got dmx?</h1>
    </div>

    <p class="mt-8 pl-[0.5em] text-sm font-medium tracking-[0.5em] text-white uppercase sm:text-base">BNFG Lighting</p>
    <p class="mt-3 text-sm text-white/55 sm:text-base">small event lighting at UO</p>

    <div class="actions">
      <a href="https://instagram.com/bnfg.lighting" target="_blank" rel="noopener" class="rounded-full border border-white/20 py-2.5 pr-6 pl-[calc(1.5rem+0.1em)] text-sm tracking-widest text-white/80 transition duration-300 hover:border-white/60 hover:bg-white/5 hover:text-white focus-visible:border-white/60 focus-visible:text-white focus-visible:outline-none">@bnfg.lighting</a>
      <button type="button" id="gallery-open" aria-controls="gallery" class="rounded-full border border-white/20 py-2.5 pr-6 pl-[calc(1.5rem+0.1em)] text-sm tracking-widest text-white/80 transition duration-300 hover:border-white/60 hover:bg-white/5 hover:text-white focus-visible:border-white/60 focus-visible:text-white focus-visible:outline-none">gallery</button>
    </div>
  </main>

  <section id="gallery" aria-label="Gallery" aria-hidden="true" inert>
    <header class="g-bar">
      <button type="button" id="gallery-close" class="g-back">&larr; back</button>
      <span class="g-brand">BNFG Lighting</span>
    </header>
    <div class="g-scroll" id="gallery-scroll">
      <div id="gallery-entries"></div>
    </div>
  </section>

  <script src="gallery.js"></script>

</body>
</html>
